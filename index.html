// ============ RENDER ============
function renderAll() {
    if (curCat === 'fruit') { renderAllFruit(); return; }
    var d = curData;
    if (!d) { console.error('renderAll: curData is null'); return; }
    if (!d.items) { console.error('renderAll: no items in data'); return; }
    document.getElementById('dataDate').textContent = d.date || '--';
    document.getElementById('dataSource').textContent = d.source || '--';
    document.getElementById('activeCount').textContent = d.activeItems || 0;
    document.getElementById('avgPrice').textContent = (d.avgPrice || 0).toFixed(2);
    document.getElementById('upCount').textContent = d.upCount || 0;
    document.getElementById('downCount').textContent = d.downCount || 0;
    document.getElementById('flatCount').textContent = d.flatCount || 0;
    renderTable();
}

function renderTable() {
    // 水果品类：数据格式不同，单独处理
    if (curCat === 'fruit') { renderFruitTable(); return; }
    var items = curData.items;
    var filter = document.getElementById('catFilter').value;
    var search = document.getElementById('searchInput').value.toLowerCase();
    
    if (filter !== '全部') {
        items = items.filter(function(i) { return i.category === filter; });
    }
    if (search) {
        items = items.filter(function(i) { return i.name.toLowerCase().indexOf(search) >= 0; });
    }
    
    var h = '';
    for (var i=0; i<items.length; i++) {
        var it = items[i];
        var cls = it.change > 0 ? 'up' : it.change < 0 ? 'down' : 'flat';
        var sign = it.change > 0 ? '+' : '';
        var txt = it.change === 0 ? '→' : (sign + it.change.toFixed(2));
        var stag = '';
        if (it.supplyStatus === 'in_season') {
            stag = '<span class="stag s-' + (it.season || '全年') + '">当季</span>';
        }
        h += '<tr>';
        h += '<td><b>' + it.name + '</b></td>';
        h += '<td>' + (it.category || '') + '</td>';
        h += '<td><b>' + it.price.toFixed(2) + '</b></td>';
        h += '<td>' + (it.yesterdayPrice || 0).toFixed(2) + '</td>';
        h += '<td class="' + cls + '">' + txt + '</td>';
        h += '<td>' + stag + '</td>';
        h += '</tr>';
    }
    if (items.length === 0) h = '<tr><td colspan="6" style="text-align:center;color:#999;padding:30px">无匹配数据</td></tr>';
    document.getElementById('priceBody').innerHTML = h;
    
    // sidebar
    renderSidebar(items);
}

function renderSidebar(items) {
    var sorted = items.slice().sort(function(a,b){ return b.change - a.change; });
    var top5 = sorted.slice(0,5);
    var bot5 = sorted.slice(-5).reverse();
    
    document.getElementById('topRise').innerHTML = top5.map(function(i){
        return '<div class="tm-item"><span>' + i.name + '</span><span class="up">' + (i.change > 0 ? '+' : '') + i.change.toFixed(2) + '</span></div>';
    }).join('');
    
    document.getElementById('topFall').innerHTML = bot5.map(function(i){
        return '<div class="tm-item"><span>' + i.name + '</span><span class="down">' + i.change.toFixed(2) + '</span></div>';
    }).join('');
    
    var catMap = {};
    for (var i=0; i<items.length; i++) {
        var c = items[i].category;
        if (!catMap[c]) catMap[c] = {sum:0, cnt:0};
        catMap[c].sum += items[i].price;
        catMap[c].cnt += 1;
    }
    var cats = Object.keys(catMap);
    document.getElementById('catAvg').innerHTML = cats.map(function(k){
        return '<div class="tm-item"><span>' + k + '</span><span>' + (catMap[k].sum / catMap[k].cnt).toFixed(2) + '</span></div>';
    }).join('');
}

// ============ EXPORT ============
function getExportData() {
    var items = curData.items;
    var mktName = mktNames[curMkt] || curMkt;
    var date = curData.date || '--';
    var rows = [];
    // header
    rows.push(['市场', mktName]);
    rows.push(['日期', date]);
    rows.push(['品种', '品类', '今日价(元/斤)', '昨日价(元/斤)', '涨跌(元)', '涨跌幅(%)', '供应状态']);
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        rows.push([it.name, it.category || '', it.price.toFixed(2), (it.yesterdayPrice || 0).toFixed(2), (it.change || 0).toFixed(2), (it.pctChange || 0).toFixed(1), it.supplyStatus === 'in_season' ? '当季' : '下市']);
    }
    return rows;
}

function exportCSV() {
    var rows = getExportData();
    var csv = '\uFEFF'; // BOM for Excel UTF-8
    for (var i = 0; i < rows.length; i++) {
        csv += rows[i].map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',') + '\n';
    }
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '悦鲜森_' + curMkt.toUpperCase() + '_' + curData.date + '.csv';
    a.click();
    URL.revokeObjectURL(url);
}

        }

    }
    html += '</table>';
    var blob = new Blob(['<html><head><meta charset="UTF-8"></head><body>' + html + '</body></html>'], { type: 'application/vnd.ms-excel' });

    var a = document.createElement('a');
    a.href = url;
    a.download = '悦鲜森_' + curMkt.toUpperCase() + '_' + curData.date + '.xls';
    a.click();
    URL.revokeObjectURL(url);
}

var fruitCurCat = '全部';
var fruitFilteredData = [];

function renderAllFruit() {
    document.getElementById('dataDate').textContent = FRUIT_DATA.date || '--';
    document.getElementById('dataSource').textContent = FRUIT_DATA.source || '--';

    // 更新品类筛选器
    var filter = document.getElementById('catFilter');
    var fruitCats = ['全部','仁果类','浆果类','核果类','坚果类','柑果类','热带及亚热带水果','瓜类水果','其他果品'];
    filter.innerHTML = '';
    for (var i = 0; i < fruitCats.length; i++) {
        var opt = document.createElement('option');
        opt.value = fruitCats[i];
        opt.textContent = fruitCats[i];
        if (fruitCats[i] === fruitCurCat) opt.selected = true;
        filter.appendChild(opt);
    }

    // 更新搜索框行为
    var search = document.getElementById('searchInput');
    var oldHandler = search.oninput;
    if (oldHandler && oldHandler.toString().indexOf('renderFruitTable') < 0) {
        search._oldOnInput = oldHandler;
    }
    search.oninput = renderFruitTable;

    renderFruitTable();
}

function renderFruitTable() {
    var filter = fruitCurCat;
    var search = document.getElementById('searchInput').value.toLowerCase();

    var items = [];
    // 从 ALL_FRUIT_DATA 过滤
    for (var i = 0; i < ALL_FRUIT_DATA.length; i++) {
        var d = ALL_FRUIT_DATA[i];
        if (filter !== '全部' && d.category !== filter) continue;
        if (search && d.name.toLowerCase().indexOf(search) < 0) continue;
        items.push(d);
    }

    fruitFilteredData = items;
    fruitCurCat = filter;

    // 统计
    var withData = 0, totalPrice = 0;
    for (var i = 0; i < items.length; i++) {
        if (items[i].markets > 0) { withData++; totalPrice += items[i].avgPrice; }
    }
    document.getElementById('activeCount').textContent = withData;
    document.getElementById('avgPrice').textContent = withData > 0 ? (totalPrice / withData).toFixed(2) : '-';
    document.getElementById('upCount').textContent = '--';
    document.getElementById('downCount').textContent = '--';
    document.getElementById('flatCount').textContent = '--';

    // 按品类分组，品类内按父品种分组
    var h = '';
    // 先按品类排序
    var catOrder = ['仁果类','浆果类','核果类','坚果类','柑果类','热带及亚热带水果','瓜类水果','其他果品'];
    items.sort(function(a,b) {
        var ci = catOrder.indexOf(a.category), cj = catOrder.indexOf(b.category);
        if (ci < 0) ci = 99; if (cj < 0) cj = 99;
        if (ci !== cj) return ci - cj;
        // 同品类内按code排序（父品种在前，子品种在后）
        return a.code.localeCompare(b.code);
    });

    var lastCat = '';
    var parentNames = {}; // 记录已出现的父品种名称
    for (var i = 0; i < items.length; i++) {
        var d = items[i];
        var isParent = d.code.length === 5; // 5位code是父品种（如AF01001苹果），8位是子品种
        var parentCode = d.code.substring(0, 5); // 取前5位找父品种

        // 品类分隔
        if (d.category !== lastCat) {
            // 计算该品类数量
            var catCnt = 0;
            for (var j = i; j < items.length; j++) { if (items[j].category === d.category) catCnt++; }
            var catEmoji = {'仁果类':'🍎','浆果类':'🍇','核果类':'🍑','坚果类':'🥜','柑果类':'🍊','热带及亚热带水果':'🍌','瓜类水果':'🍉','其他果品':'🥝'}[d.category] || '🍏';
            h += '<tr class="fruit-cat-sep"><td colspan="4" style="background:#fff8f0;font-weight:bold;color:#e67e22;padding:10px 12px;font-size:14px;border-bottom:2px solid #f0d6b0">' + catEmoji + ' ' + d.category + ' <span style="font-weight:normal;font-size:12px;color:#888">（' + catCnt + '种）</span></td></tr>';
            lastCat = d.category;
        }

        var priceStr = d.avgPrice > 0 ? d.avgPrice.toFixed(2) : '--';
        var indentClass = isParent ? 'fruit-parent' : 'fruit-child';
        var indentStyle = isParent ? 'font-weight:bold;font-size:13px' : 'padding-left:28px;font-size:12px;color:#555';
        var nameHtml = isParent ? '▸ ' + d.name : '· ' + d.name;

        h += '<tr class="' + indentClass + '">';
        h += '<td style="' + indentStyle + '">' + nameHtml + '</td>';
        h += '<td style="' + (isParent ? 'font-size:13px' : 'font-size:12px;color:#888') + '">' + d.category + '</td>';
        h += '<td style="text-align:right;' + (isParent ? 'font-weight:bold' : '') + '">' + priceStr + '</td>';
        h += '<td>' + (d.markets > 0 ? '<span class="stag s-全年">在售</span>' : '<span class="stag s-冬">暂无</span>') + '</td>';
        h += '</tr>';
    }
    if (items.length === 0) h = '<tr><td colspan="6" style="text-align:center;color:#999;padding:30px">无匹配数据</td></tr>';
    document.getElementById('priceBody').innerHTML = h;

    // 渲染侧边栏
    renderFruitSidebar(items);
}

function renderFruitSidebar(items) {
    var sorted = items.slice().sort(function(a,b) { return b.avgPrice - a.avgPrice; });
    var withData = [];
    for (var i = 0; i < sorted.length; i++) { if (sorted[i].avgPrice > 0) withData.push(sorted[i]); }

    var topHigh = withData.slice(0, 5);
    var highHtml = '';
    for (var i = 0; i < topHigh.length; i++) {
        highHtml += '<div class="tm-item"><span>' + (i+1) + '. ' + topHigh[i].name + '</span><span class="up">¥' + topHigh[i].avgPrice.toFixed(2) + '</span></div>';
    }
    document.getElementById('topRise').innerHTML = highHtml || '--';

    var topLow = withData.slice(-5).reverse();
    var lowHtml = '';
    for (var i = 0; i < topLow.length; i++) {
        lowHtml += '<div class="tm-item"><span>' + (i+1) + '. ' + topLow[i].name + '</span><span class="down">¥' + topLow[i].avgPrice.toFixed(2) + '</span></div>';
    }
    document.getElementById('topFall').innerHTML = lowHtml || '--';

    var catMap = {};
    for (var i = 0; i < items.length; i++) {
        var c = items[i].category;
        if (!catMap[c]) catMap[c] = {cnt:0, sum:0};
        catMap[c].cnt++;
        if (items[i].avgPrice > 0) catMap[c].sum += items[i].avgPrice;
    }
    var cats = Object.keys(catMap);
    var catHtml = '';
    for (var i = 0; i < cats.length; i++) {
        var k = cats[i];
        var m = catMap[k];
        var avg = m.cnt > 0 ? (m.sum / m.cnt).toFixed(2) : '-';
        catHtml += '<div class="tm-item"><span>' + k + '</span><span>¥' + avg + '</span></div>';
    }
    document.getElementById('catAvg').innerHTML = catHtml || '--';
}

var chartRange = 7;

function getHistoryDataForCurrent() {
    // 根据当前市场/品类获取对应历史数据
    var key = curMkt;
    if (curCat !== 'veg') {
        key = curCat; // pork, poultry, seafood
    }
    return HISTORY_DATA[key] || HISTORY_DATA[curCat] || [];
}

function populateChartItems() {
    var sel = document.getElementById('chartItem');
    if (!sel) return;
    sel.innerHTML = '';
    var items = curData && curData.items ? curData.items : [];
    for (var i = 0; i < items.length; i++) {
        var opt = document.createElement('option');
        opt.value = items[i].name;
        opt.textContent = items[i].name;
        sel.appendChild(opt);
    }
    // 默认选第一个
    if (items.length > 0) {
        sel.value = items[0].name;
    }
}

function setChartRange(days, btn) {
    chartRange = days;
    var btns = document.querySelectorAll('.chart-range-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    if (btn) btn.classList.add('active');
    drawChart();
}

function drawChart() {
    var canvas = document.getElementById('priceChart');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    
    var itemName = document.getElementById('chartItem').value;
    var histData = getHistoryDataForCurrent();
    
    if (!histData || histData.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#999';
        ctx.font = '13px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.fillText('暂无历史数据', canvas.width/2, canvas.height/2);
        document.getElementById('chartInfo').textContent = '';
        return;
    }
    
    // 取最近 N 天
    var recent = histData.slice(-chartRange);
    
    // 提取该品种的价格时间序列
    var dates = [];
    var prices = [];
    for (var i = 0; i < recent.length; i++) {
        var day = recent[i];
        var found = null;
        for (var j = 0; j < day.items.length; j++) {
            if (day.items[j].name === itemName) {
                found = day.items[j];
                break;
            }
        }
        dates.push(day.date);
        prices.push(found ? found.price : null);
    }
    
    document.getElementById('chartInfo').textContent = 
        itemName + ' · ' + (chartRange === 7 ? '近7天' : '近30天') + ' · 共' + recent.length + '天数据';
    
    // 设置 canvas 尺寸
    var wrap = document.getElementById('chartCanvasWrap');
    var dpr = window.devicePixelRatio || 1;
    var rect = wrap.getBoundingClientRect();
    var w = rect.width;
    var h = 320;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    
    // 找到有效价格范围
    var validPrices = prices.filter(function(p) { return p !== null; });
    if (validPrices.length === 0) {
        ctx.fillStyle = '#999';
        ctx.font = '13px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.fillText('该品种暂无历史数据', w/2, h/2);
        return;
    }
    
    var minPrice = Math.min.apply(null, validPrices);
    var maxPrice = Math.max.apply(null, validPrices);
    var range = maxPrice - minPrice;
    if (range === 0) range = 1;
    minPrice -= range * 0.15;
    maxPrice += range * 0.15;
    if (minPrice < 0) minPrice = 0;
    
    // 绘图区域
    var pad = {top: 20, right: 30, bottom: 40, left: 55};
    var pw = w - pad.left - pad.right;
    var ph = h - pad.top - pad.bottom;
    
    // 清空
    ctx.clearRect(0, 0, w, h);
    
    // 背景
    ctx.fillStyle = '#fafbfc';
    ctx.fillRect(pad.left, pad.top, pw, ph);
    
    // 网格线
    var gridLines = 5;
    ctx.strokeStyle = '#e8e8e8';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    for (var i = 0; i <= gridLines; i++) {
        var y = pad.top + (ph / gridLines) * i;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + pw, y);
        ctx.stroke();
        
        // Y 轴标签
        var val = maxPrice - ((maxPrice - minPrice) / gridLines) * i;
        ctx.fillStyle = '#666';
        ctx.font = '10px Microsoft YaHei';
        ctx.textAlign = 'right';
        ctx.fillText(val.toFixed(2), pad.left - 6, y + 3);
    }
    ctx.setLineDash([]);
    
    // X 轴标签
    ctx.fillStyle = '#666';
    ctx.font = '9px Microsoft YaHei';
    ctx.textAlign = 'center';
    var maxLabels = Math.floor(pw / 55);
    var step = Math.max(1, Math.ceil(dates.length / maxLabels));
    for (var i = 0; i < dates.length; i += step) {
        var x = pad.left + (pw / (dates.length - 1 || 1)) * i;
        ctx.fillText(dates[i].slice(5), x, pad.top + ph + 16);
    }
    
    // 坐标轴
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, pad.top + ph);
    ctx.lineTo(pad.left + pw, pad.top + ph);
    ctx.stroke();
    
    // 标题
    ctx.fillStyle = '#1a5276';
    ctx.font = 'bold 12px Microsoft YaHei';
    ctx.textAlign = 'left';
    ctx.fillText(itemName + ' 价格走势', pad.left, pad.top - 6);
    
    // Y轴单位
    ctx.fillStyle = '#999';
    ctx.font = '9px Microsoft YaHei';
    ctx.textAlign = 'left';
    ctx.fillText('元/斤', pad.left + 4, pad.top - 6);
    
    // 绘制折线
    var lineColor = '#2e86c1';
    var pointColor = '#1a5276';
    
    // 收集有效点
    var validPoints = [];
    for (var i = 0; i < prices.length; i++) {
        if (prices[i] !== null) {
            var x = pad.left + (pw / (prices.length - 1 || 1)) * i;
            var y = pad.top + ph - ((prices[i] - minPrice) / (maxPrice - minPrice)) * ph;
            validPoints.push({x: x, y: y, price: prices[i], date: dates[i]});
        }
    }
    
    // 渐变填充
    if (validPoints.length > 1) {
        var grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ph);
        grad.addColorStop(0, 'rgba(46,134,193,0.25)');
        grad.addColorStop(1, 'rgba(46,134,193,0.02)');
        
        ctx.beginPath();
        ctx.moveTo(validPoints[0].x, validPoints[0].y);
        for (var i = 1; i < validPoints.length; i++) {
            // 贝塞尔曲线平滑
            if (validPoints[i-1] && validPoints[i]) {
                var cx = (validPoints[i-1].x + validPoints[i].x) / 2;
                ctx.quadraticCurveTo(validPoints[i-1].x, validPoints[i-1].y, cx, (validPoints[i-1].y + validPoints[i].y) / 2);
            }
        }
        ctx.lineTo(validPoints[validPoints.length-1].x, validPoints[validPoints.length-1].y);
        // 闭合填充区域
        ctx.lineTo(validPoints[validPoints.length-1].x, pad.top + ph);
        ctx.lineTo(validPoints[0].x, pad.top + ph);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        
        // 折线
        ctx.beginPath();
        ctx.moveTo(validPoints[0].x, validPoints[0].y);
        for (var i = 1; i < validPoints.length; i++) {
            if (validPoints[i-1] && validPoints[i]) {
                var cx = (validPoints[i-1].x + validPoints[i].x) / 2;
                ctx.quadraticCurveTo(validPoints[i-1].x, validPoints[i-1].y, cx, (validPoints[i-1].y + validPoints[i].y) / 2);
            }
        }
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 数据点
        for (var i = 0; i < validPoints.length; i++) {
            var pt = validPoints[i];
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = pointColor;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 价格标注
            ctx.fillStyle = pointColor;
            ctx.font = 'bold 10px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(pt.price.toFixed(2), pt.x, pt.y - 10);
        }
    }
    
    // 鼠标悬停事件
    canvas.onmousemove = function(e) {
        var rect2 = canvas.getBoundingClientRect();
        var mx = e.clientX - rect2.left;
        var my = e.clientY - rect2.top;
        var tooltip = document.getElementById('chartTooltip');
        
        var closest = null;
        var minDist = 30;
        for (var i = 0; i < validPoints.length; i++) {
            var dx = Math.abs(mx - validPoints[i].x);
            var dy = Math.abs(my - validPoints[i].y);
            var dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < minDist) {
                minDist = dist;
                closest = validPoints[i];
            }
        }
        
        if (closest) {
            tooltip.style.display = 'block';
            tooltip.style.left = (closest.x + 12) + 'px';
            tooltip.style.top = (closest.y - 30) + 'px';
            tooltip.innerHTML = '<b>' + closest.date + '</b><br>' + itemName + ': ' + closest.price.toFixed(2) + ' 元/斤';
        } else {
            tooltip.style.display = 'none';
        }
    };
    
    canvas.onmouseleave = function() {
        document.getElementById('chartTooltip').style.display = 'none';
    };
}

// 重写 renderAll 以同时更新图表
var _originalRenderAll = renderAll;
renderAll = function() {
    _originalRenderAll();
    setTimeout(function() {
        populateChartItems();
        drawChart();
    }, 100);
};

</script>
